<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小福狮情绪泡泡</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#bfe8ef;color:var(--ink)}button{font:inherit;color:inherit}
.app{position:relative;width:100%;height:100%;isolation:isolate;background:linear-gradient(150deg,#8bd5e7,#f5c98f);overflow:hidden}.idle-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}.hidden{display:none!important}
.app:after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(20,56,70,.08),rgba(10,30,35,.28)),radial-gradient(circle at 50% 25%,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.ambient{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.light{position:absolute;border-radius:50%;filter:blur(12px);opacity:.42;animation:lightFloat 11s ease-in-out infinite}.l1{width:260px;height:260px;left:-80px;top:20%;background:#b7f7ff}.l2{width:330px;height:330px;right:-120px;top:4%;background:#ffe9a8;animation-delay:-4s}.l3{width:230px;height:230px;left:44%;bottom:-120px;background:#ffc4d5;animation-delay:-7s}.particle{position:absolute;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 0 16px rgba(255,255,255,.65);animation:rise var(--d) linear infinite;animation-delay:var(--delay)}
.sound{position:absolute;right:max(24px,env(safe-area-inset-right));top:max(20px,var(--safe-top));z-index:12;width:52px;height:52px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.17);box-shadow:0 8px 28px rgba(23,48,57,.18),inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:22px;transition:.25s}.sound:active{transform:scale(.9)}
.intro{position:absolute;left:50%;top:10.5%;transform:translateX(-50%);width:min(88vw,940px);text-align:center;text-shadow:0 3px 18px rgba(0,0,0,.36);animation:introIn 1s cubic-bezier(.2,.8,.2,1)}.intro h1{margin:0;font-size:clamp(31px,4.1vw,58px);font-weight:900;letter-spacing:.04em}.intro p{margin:12px 0 0;font-size:clamp(16px,1.8vw,23px);font-weight:650;opacity:.95}
.bubbles{position:absolute;left:50%;bottom:max(35px,calc(var(--safe-bottom) + 20px));transform:translateX(-50%);width:min(92vw,1110px);display:flex;align-items:flex-end;justify-content:space-around;gap:clamp(15px,3vw,44px);z-index:5}.bubble{--c1:rgba(255,216,94,.32);--c2:rgba(255,147,66,.14);position:relative;width:clamp(220px,27vw,310px);aspect-ratio:1;border:1.5px solid rgba(255,255,255,.65);border-radius:50%;padding:30px 25px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 31% 24%,rgba(255,255,255,.58) 0 3%,rgba(255,255,255,.16) 14%,transparent 33%),radial-gradient(circle at 65% 70%,var(--c1),transparent 56%),linear-gradient(145deg,rgba(255,255,255,.22),var(--c2));box-shadow:inset 14px 18px 28px rgba(255,255,255,.14),inset -16px -20px 28px rgba(43,83,91,.11),0 22px 45px rgba(20,49,57,.24),0 0 0 7px rgba(255,255,255,.045);backdrop-filter:blur(9px) saturate(1.25);-webkit-backdrop-filter:blur(9px) saturate(1.25);cursor:pointer;overflow:hidden;animation:bob 4.3s ease-in-out infinite;transition:filter .25s,box-shadow .25s}.bubble:before{content:"";position:absolute;width:38%;height:18%;left:17%;top:10%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));filter:blur(2px);transform:rotate(-25deg)}.bubble:after{content:"";position:absolute;width:18px;height:18px;right:17%;bottom:17%;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:-16px 10px 0 -5px rgba(255,255,255,.32)}.bubble:nth-child(2){animation-delay:-1.4s}.bubble:nth-child(3){animation-delay:-2.8s}.bubble:active,.bubble.active{animation-play-state:paused;transform:translateY(-12px) scale(1.055);filter:brightness(1.12);box-shadow:inset 14px 18px 28px rgba(255,255,255,.2),inset -16px -20px 28px rgba(43,83,91,.08),0 30px 60px rgba(20,49,57,.34),0 0 0 9px rgba(255,255,255,.13)}.happy{--c1:rgba(255,210,70,.42);--c2:rgba(255,145,52,.16)}.sad{--c1:rgba(92,211,245,.38);--c2:rgba(84,140,238,.15)}.angry{--c1:rgba(255,116,101,.4);--c2:rgba(241,69,118,.14)}
.face-wrap{position:relative;width:94px;height:94px;margin-bottom:10px;display:grid;place-items:center}.face{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(31,50,53,.22));animation:faceIdle 3.2s ease-in-out infinite}.fallback{display:none;font-size:64px;line-height:1;filter:drop-shadow(0 8px 10px rgba(31,50,53,.2))}.bubble h2{margin:0 0 8px;font-size:clamp(24px,2.5vw,33px);font-weight:900;text-shadow:0 2px 10px rgba(27,54,60,.33)}.bubble p{margin:0;max-width:235px;font-size:clamp(15px,1.5vw,19px);line-height:1.5;font-weight:650;text-shadow:0 2px 8px rgba(27,54,60,.36)}
.panel-backdrop{position:absolute;inset:0;z-index:18;background:rgba(12,32,39,.24);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.35s}.panel-backdrop.show{opacity:1}.panel{position:absolute;left:50%;top:50%;z-index:20;transform:translate(-50%,-42%) scale(.86);width:min(82vw,580px);min-height:390px;padding:30px;border:1px solid rgba(255,255,255,.68);border-radius:52px;text-align:center;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.72),transparent 18%),linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.19));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 35px 90px rgba(12,35,43,.38);backdrop-filter:blur(25px) saturate(1.25);-webkit-backdrop-filter:blur(25px) saturate(1.25);opacity:0;pointer-events:none;transition:.42s cubic-bezier(.2,.85,.2,1)}.panel.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}.close{position:absolute;right:20px;top:18px;width:42px;height:42px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(255,255,255,.16);font-size:24px}.action-media{display:block;width:min(300px,65vw);height:220px;object-fit:contain;margin:0 auto 10px;filter:drop-shadow(0 15px 18px rgba(20,45,52,.19))}.panel strong{display:block;font-size:30px;text-shadow:0 2px 12px rgba(27,54,60,.3)}.panel span{display:block;margin-top:9px;font-size:19px;line-height:1.65;font-weight:600}.breath{display:none;position:relative;width:170px;height:170px;margin:25px auto 32px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.88) 0 18%,rgba(125,224,240,.65) 20% 48%,rgba(255,199,105,.72) 50% 68%,rgba(255,255,255,.15) 70%);box-shadow:0 0 40px rgba(137,225,240,.65);animation:breathe 6s ease-in-out infinite}.breath:after{content:"吸 · 呼";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:900;color:#52747b}.panel.breathing .breath{display:block}.panel.breathing .action-media{display:none}
@keyframes introIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-13px) rotate(.6deg)}}@keyframes faceIdle{0%,100%{transform:scale(1) rotate(-2deg)}48%{transform:scale(1.06) rotate(2deg)}55%{transform:scale(1.02) rotate(0)}}@keyframes breathe{0%,100%{transform:scale(.62);filter:hue-rotate(0deg)}48%,55%{transform:scale(1.08);filter:hue-rotate(10deg)}}@keyframes lightFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(35px,-28px) scale(1.16)}}@keyframes rise{0%{transform:translateY(110vh) scale(.4);opacity:0}12%{opacity:.75}90%{opacity:.35}100%{transform:translateY(-20vh) scale(1.15);opacity:0}}
@media(max-width:830px) and (orientation:portrait){.intro{top:8%;width:90vw}.intro h1{font-size:34px}.bubbles{bottom:max(16px,calc(var(--safe-bottom) + 8px));width:95vw;flex-direction:column;align-items:center;gap:8px}.bubble{width:min(88vw,540px);height:145px;aspect-ratio:auto;border-radius:74px;display:grid;grid-template-columns:90px 1fr;padding:15px 28px;text-align:left}.face-wrap{grid-row:1/3;margin:0;width:72px;height:72px}.bubble h2{align-self:end;margin:0 0 3px}.bubble p{align-self:start;max-width:none}.bubble:before{width:25%;height:28%;top:4%}.panel{min-height:370px}}@media(max-height:680px) and (orientation:landscape){.intro{top:6%}.intro p{display:none}.bubbles{bottom:15px}.bubble{width:min(25vw,240px);padding:20px}.face-wrap{width:72px;height:72px;margin-bottom:4px}.bubble p{font-size:14px}.bubble h2{font-size:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style></head>
<body><main class="app" id="app">
<img id="idleImage" class="idle-media hidden" alt="待机背景"><video id="idleVideo" class="idle-media hidden" autoplay muted loop playsinline></video>
<div class="ambient"><i class="light l1"></i><i class="light l2"></i><i class="light l3"></i></div>
<button id="sound" class="sound" aria-label="切换音效">♪</button>
<section class="intro"><h1>现在的你，是哪一种心情？</h1><p>轻轻触碰一个泡泡，让小福狮陪你照顾此刻的心情。</p></section>
<section class="bubbles" aria-label="选择心情">
<button class="bubble happy" data-kind="happy"><div class="face-wrap"><img class="face" data-face="happy" alt="开心表情"><span class="fallback">😊</span></div><h2>开心泡泡</h2><p>笑眯眯，拍拍小手，留住开心。</p></button>
<button class="bubble sad" data-kind="sad"><div class="face-wrap"><img class="face" data-face="sad" alt="难过表情"><span class="fallback">🥺</span></div><h2>难过泡泡</h2><p>轻轻抱抱自己，安慰自己。</p></button>
<button class="bubble angry" data-kind="angry"><div class="face-wrap"><img class="face" data-face="angry" alt="生气表情"><span class="fallback">😤</span></div><h2>生气泡泡</h2><p>跟着小福狮深呼吸，吸～呼～慢慢放松肩膀。</p></button>
</section>
<div class="panel-backdrop" id="backdrop"></div><aside class="panel" id="panel"><button class="close" id="close" aria-label="关闭">×</button><img id="actionMedia" class="action-media" alt="互动动画"><div class="breath"></div><strong id="panelTitle"></strong><span id="panelText"></span></aside>
</main><script>
/* 在这里设置你的本地资源路径 */
const RESOURCE_CONFIG={idle:"assets/idle.mp4",happyFace:"assets/happy.png",sadFace:"assets/sad.png",angryFace:"assets/angry.png",happyAction:"assets/happy.gif",sadAction:"assets/sad.gif",angryAction:"assets/angry.gif"};
const COPY={happy:["把开心留住","跟小福狮一起拍拍小手：一、二、三！"],sad:["给自己一个抱抱","双手轻轻抱住肩膀。你已经做得很好了。"],angry:["慢慢深呼吸","吸气 3 秒，停一停，再慢慢呼气 3 秒。放松肩膀。"]};
const ext=p=>(p.split('?')[0].split('.').pop()||'').toLowerCase(),app=document.getElementById('app'),idleImage=document.getElementById('idleImage'),idleVideo=document.getElementById('idleVideo');
if(['mp4','webm','mov'].includes(ext(RESOURCE_CONFIG.idle))){idleVideo.src=RESOURCE_CONFIG.idle;idleVideo.classList.remove('hidden');idleVideo.onerror=()=>idleVideo.classList.add('hidden')}else{idleImage.src=RESOURCE_CONFIG.idle;idleImage.classList.remove('hidden');idleImage.onerror=()=>idleImage.classList.add('hidden')}
for(const k of ['happy','sad','angry']){const img=document.querySelector(`[data-face="${k}"]`),fb=img.nextElementSibling;img.src=RESOURCE_CONFIG[k+'Face'];img.onerror=()=>{img.style.display='none';fb.style.display='block'}}
const ambient=document.querySelector('.ambient');for(let i=0;i<17;i++){const p=document.createElement('i');p.className='particle';const s=3+Math.random()*7;p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--d:${9+Math.random()*11}s;--delay:${-Math.random()*18}s`;ambient.appendChild(p)}
const panel=document.getElementById('panel'),backdrop=document.getElementById('backdrop'),media=document.getElementById('actionMedia'),pt=document.getElementById('panelTitle'),px=document.getElementById('panelText');let timer,audioOn=true,ctx;
function tone(f){if(!audioOn)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.09,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.2);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.22)}
function hide(){panel.classList.remove('show');backdrop.classList.remove('show');document.querySelectorAll('.bubble').forEach(x=>x.classList.remove('active'));clearTimeout(timer)}
document.querySelectorAll('.bubble').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.bubble').forEach(x=>x.classList.remove('active'));b.classList.add('active');const k=b.dataset.kind,[t,x]=COPY[k],src=RESOURCE_CONFIG[k+'Action'];pt.textContent=t;px.textContent=x;panel.classList.toggle('breathing',k==='angry'&&!src);media.style.display=src?'block':'none';if(src){media.src='';requestAnimationFrame(()=>media.src=src);media.onerror=()=>{media.style.display='none';if(k==='angry')panel.classList.add('breathing')}}panel.classList.add('show');backdrop.classList.add('show');tone([680,460,340][i]);clearTimeout(timer);timer=setTimeout(hide,k==='angry'?8500:6000)});
document.getElementById('close').onclick=hide;backdrop.onclick=hide;document.getElementById('sound').onclick=e=>{audioOn=!audioOn;e.currentTarget.textContent=audioOn?'♪':'×';e.currentTarget.setAttribute('aria-label',audioOn?'关闭音效':'开启音效')};
</script></body></html>
